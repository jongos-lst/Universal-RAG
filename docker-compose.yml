services:
  redis:
    build:
      context: .
      dockerfile: redis.dockerfile
    environment:
      REDIS_ARGS: "--appendonly yes --maxmemory 1gb --maxmemory-policy noeviction --requirepass ${REDIS_PASSWORD:-local-development-only}"
      REDISCLI_AUTH: ${REDIS_PASSWORD:-local-development-only}
    volumes:
      - redis_v2_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    build:
      context: .
      dockerfile: backend.dockerfile
      target: backend
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-local-development-only}
      REDIS_INDEX_NAME: ${REDIS_INDEX_NAME:-unibot_v2}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/unibot/health_check', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
  frontend:
    build:
      context: .
      dockerfile: backend.dockerfile
      target: frontend
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      RAG_API_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
volumes:
  redis_v2_data:
